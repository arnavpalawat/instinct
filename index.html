<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instinct | Briefing Archive</title>
<meta name="description" content="Archive of Instinct daily financial briefings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:          #fafaf9;
  --bg-surface:  #ffffff;
  --border:      #e7e5e4;
  --border-light:#f5f5f4;
  --text:        #1c1917;
  --text-2:      #44403c;
  --text-3:      #78716c;
  --accent:      #b91c1c;
  --accent-hover:#991b1b;
  --accent-bg:   #fef2f2;
  --card-shadow: 0 1px 3px rgba(0,0,0,.04);
  --radius:      4px;
  --serif:       "Instrument Serif", "Georgia", "Times New Roman", serif;
  --sans:        "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono:        "JetBrains Mono", "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:          #0c0a09;
    --bg-surface:  #1c1917;
    --border:      #292524;
    --border-light:#1c1917;
    --text:        #fafaf9;
    --text-2:      #d6d3d1;
    --text-3:      #a8a29e;
    --accent:      #fca5a5;
    --accent-hover:#fecaca;
    --accent-bg:   #451a1a;
    --card-shadow: none;
  }
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.65;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 24px;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

/* Header */
.header {
  border-bottom: 3px double var(--border);
  padding: 28px 0 20px;
  text-align: center;
}

.header-name {
  font-family: var(--serif);
  font-size: 42px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.1;
}

.header-rule {
  border: none;
  border-top: 1px solid var(--border);
  margin: 12px 0 8px;
}

.header-sub {
  font-size: 13px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Edition List */
.editions {
  padding: 8px 0 48px;
}

.edition-card {
  display: block;
  padding: 20px 0;
  border-bottom: 1px solid var(--border-light);
  text-decoration: none;
  color: inherit;
}

.edition-card:hover { text-decoration: none; }
.edition-card:first-child { padding-top: 20px; }

.edition-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.edition-date {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.edition-meta {
  font-size: 12px;
  color: var(--text-3);
  font-family: var(--mono);
}

.edition-headline {
  margin: 6px 0 0;
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 400;
  color: var(--text);
  line-height: 1.3;
}

.edition-card:hover .edition-headline {
  color: var(--accent);
}

/* Empty state */
.empty {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-3);
}

.empty p:first-child {
  font-family: var(--serif);
  font-size: 24px;
  color: var(--text-2);
  margin-bottom: 8px;
}

/* Footer */
.footer {
  border-top: 3px double var(--border);
  padding: 20px 0 48px;
  font-size: 12px;
  color: var(--text-3);
  text-align: center;
}
</style>
</head>
<body>

<div class="container">

  <header class="header">
    <div class="header-name">Instinct</div>
    <hr class="header-rule">
    <div class="header-sub">
      1 edition published
    </div>
  </header>

  <div class="editions">
    
      
      <a class="edition-card" href="briefings/2026-09-20/index.html">
        <div class="edition-top">
          <span class="edition-date">Sun, Sep 20, 2026</span>
          <div class="edition-meta">
            <span>131w</span>
          </div>
        </div>
        
        <div class="edition-headline">Weekend Market Recap

SP500: 7,650</div>
        
      </a>
      
    
  </div>

  <footer class="footer">
    Generated 2026-09-20 01:37 UTC
  </footer>

</div>

</body>
</html>
